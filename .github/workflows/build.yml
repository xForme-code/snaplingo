name: 构建

# 存在的意义：本项目在 macOS 上开发，而 Windows 的代码路径**从来没被编译过**
# ——本机连类型检查都做不了（ring / CTranslate2 的构建脚本要编译 C/C++，
# 需要目标平台的工具链）。用 GitHub 的 Windows 机器来编，才能知道那些
# #[cfg(target_os = "windows")] 分支到底成不成立。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 cmake（CTranslate2 要用）
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: 编译 sidecar
        run: |
          bash scripts/build-ocr-helper.sh
          bash scripts/build-translate-helper.sh
      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --lib
      - name: 编译检查
        working-directory: src-tauri
        run: cargo check --all-targets

  macos-intel:
    name: macOS (Intel，交叉编译)
    # GitHub 已经下架 macos-13（最后一批 Intel runner），排不到机器的 job 会
    # 干等 24 小时再超时，CI 会一直红着。所以改成在 ARM 机器上交叉编 x86_64。
    # 验不到的是「原生 Intel 机器上编译」那条路径（ct2rs 按宿主架构走的分支），
    # 但发布产物本来就是在 Apple Silicon 上交叉编出来的，这里验的正是那条路。
    #
    # macos-14 低于 15，顺带覆盖了翻译 sidecar「编占位组件」的分支。
    runs-on: macos-14
    env:
      TARGET_TRIPLE: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 cmake（CTranslate2 要用）
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: 编译 sidecar
        run: |
          bash scripts/build-ocr-helper.sh
          bash scripts/build-translate-helper.sh
      - name: 确认 sidecar 真是 x86_64
        # 以前 swiftc 的 -target 写死 arm64，而文件名后缀取 rustc host triple，
        # 会产出「名字叫 x86_64、内容是 arm64」的东西——打包能过，一运行就
        # exec format error。这一步就是拦这个。
        run: |
          for f in src-tauri/binaries/*x86_64*; do
            echo "$f: $(lipo -archs "$f")"
            lipo -archs "$f" | grep -qx x86_64 || { echo "架构不对，Intel 机器上跑不起来"; exit 1; }
          done
      - name: 编译检查（x86_64）
        working-directory: src-tauri
        # 工具链文件用来掰正 ct2rs 的宿主架构误判，见 scripts/cmake/ 下的注释。
        # 变量名带目标后缀，不带的话会波及其它目标。
        env:
          CMAKE_TOOLCHAIN_FILE_x86_64_apple_darwin: ${{ github.workspace }}/scripts/cmake/x86_64-apple-darwin.cmake
        run: cargo check --target x86_64-apple-darwin --all-targets
      # 不跑单元测试：这是 ARM 机器，跑不了 x86_64 的测试二进制。
      # 单元测试由 macOS (Apple Silicon) 那个 job 覆盖。

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # macOS 的 sidecar 在这里既编不出也用不上，但 tauri.conf.json 的
      # externalBin 要求文件存在。**不能放 0 字节的空文件**——Tauri 会把它当
      # 可执行资源嵌进去，链接器报 1169（找不到符号）。放一个真正能跑的最小程序。
      - name: 放置 sidecar 占位
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          cat > /tmp/stub.rs <<'EOF'
          fn main() {
              println!(r#"{{"ok":false,"status":"unavailable","text":"","error":"该平台不提供此组件"}}"#);
              std::process::exit(1);
          }
          EOF
          for name in snaplingo-ocr snaplingo-translate; do
            rustc -O /tmp/stub.rs -o "src-tauri/binaries/${name}-${triple}.exe"
          done
      - name: 编译检查（关键：验证 Windows 代码路径是否成立）
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --lib

  linux:
    name: Linux
    # 用 24.04 而不是 22.04：xcap 依赖的 PipeWire 绑定和 22.04 的
    # libpipewire 版本对不上（spa_meta_first 等符号找不到），是上游的
    # 版本兼容问题，不是我们的代码。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libxdo-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libpipewire-0.3-dev
      - name: 放置 sidecar 占位
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          cat > /tmp/stub.rs <<'EOF'
          fn main() {
              println!(r#"{{"ok":false,"status":"unavailable","text":"","error":"该平台不提供此组件"}}"#);
              std::process::exit(1);
          }
          EOF
          for name in snaplingo-ocr snaplingo-translate; do
            rustc -O /tmp/stub.rs -o "src-tauri/binaries/${name}-${triple}"
          done
      - name: 编译检查
        working-directory: src-tauri
        run: cargo check --all-targets
