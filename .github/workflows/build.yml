name: 构建

# 存在的意义：本项目在 macOS 上开发，而 Windows 的代码路径**从来没被编译过**
# ——本机连类型检查都做不了（ring / CTranslate2 的构建脚本要编译 C/C++，
# 需要目标平台的工具链）。用 GitHub 的 Windows 机器来编，才能知道那些
# #[cfg(target_os = "windows")] 分支到底成不成立。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 安装 cmake（CTranslate2 要用）
        run: brew list cmake >/dev/null 2>&1 || brew install cmake
      - name: 编译 sidecar
        run: |
          bash scripts/build-ocr-helper.sh
          bash scripts/build-translate-helper.sh
      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --lib
      - name: 编译检查
        working-directory: src-tauri
        run: cargo check --all-targets

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # macOS 的 sidecar 在这里既编不出也用不上，但 tauri.conf.json 的
      # externalBin 会要求文件存在。放两个占位文件让配置成立——
      # Windows 的 OCR 走系统 API，翻译走云端或 OPUS-MT，都不需要它们。
      - name: 放置 sidecar 占位
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          for name in snaplingo-ocr snaplingo-translate; do
            printf '' > "src-tauri/binaries/${name}-${triple}.exe"
          done
      - name: 编译检查（关键：验证 Windows 代码路径是否成立）
        working-directory: src-tauri
        run: cargo check --all-targets
      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --lib

  linux:
    name: Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libssl-dev libxdo-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libpipewire-0.3-dev
      - name: 放置 sidecar 占位
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          for name in snaplingo-ocr snaplingo-translate; do
            : > "src-tauri/binaries/${name}-${triple}"
          done
      - name: 编译检查
        working-directory: src-tauri
        run: cargo check --all-targets
